# Builds, tests and deploys to Azure Static Web Apps.
# Runs on every push to main (temporary, while testing) and manually: Actions tab > "Build and deploy" > Run workflow.
# The site and API are built here (not by SWA's Oryx) so we control the .NET 10 / Node versions.
# Required secret: AZURE_STATIC_WEB_APPS_API_TOKEN (Static Web App > Overview > Manage deployment token).
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish API
        run: dotnet publish src/api/Lbc.Api/Lbc.Api.csproj --configuration Release --output api-publish

      - name: Build site
        working-directory: src/web
        run: |
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src/web/_site
          api_location: api-publish
          output_location: ""
          skip_app_build: true
          skip_api_build: true
